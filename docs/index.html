<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ctm-backend" content="browser">
<title>Apparatus of Attention</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Share+Tech+Mono&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ------------------------------------------------------------- title -->
<section class="screen title-screen" id="screen-title">
  <div class="logo">
    <svg class="logo-blobs" viewBox="0 0 760 340" aria-hidden="true"></svg>
    <h1>Apparatus of<em>Attention</em></h1>
  </div>
  <p class="byline">A machine that notices things, taken apart in six steps.</p>
  <div class="plate-rule"></div>
  <p class="boot-note" id="boot-note">warming up</p>
  <nav class="menu" id="menu"></nav>
  <p class="footnote">
    Built on the Conscious Turing Machine of Lenore and Manuel Blum (PNAS, 2022).
    Terms you do not know are highlighted as you read. Hover one for a
    definition.
  </p>
</section>

<!-- -------------------------------------------------------------- play -->
<section class="screen play-screen" id="screen-play" hidden>
  <header class="hud" id="hud-panel">
    <button class="link-btn" id="btn-menu">&larr; back</button>
    <span class="level-no" id="hud-no">01</span>
    <span class="level-name" id="hud-name"></span>
    <span class="spacer"></span>
    <span class="tick" id="hud-tick">T 0000</span>
  </header>

  <p class="premise" id="premise"></p>

  <div class="stage-wrap">
    <svg class="stage" id="stage" viewBox="0 0 900 480" role="img"
         aria-label="the apparatus"></svg>
  </div>

  <p class="goal" id="goal"></p>
  <div class="progress" id="progress"></div>
  <div class="controls" id="controls"></div>
  <div class="readout" id="readout-panel"><div class="readout-body" id="readout"></div></div>
</section>

<!-- ------------------------------------------------------------ solved -->
<div class="curtain" id="curtain" hidden>
  <div class="card">
    <svg class="card-blob" viewBox="0 0 440 240" aria-hidden="true"></svg>
    <p class="eyebrow">step <span id="done-no">1</span> done</p>
    <h2 id="done-title"></h2>
    <p class="lesson" id="done-lesson"></p>
    <div class="card-actions">
      <button id="btn-again" class="link-btn">run it again</button>
      <button id="btn-next" class="big"><span class="cap">next step</span></button>
    </div>
  </div>
</div>

<div class="tip" id="tip" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
